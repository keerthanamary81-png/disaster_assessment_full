{% extends 'base.html' %}
{% block title %}Delete Assessment{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem;"></i>
                <h5 class="mt-3">Delete Assessment #{{ assessment.id }}?</h5>
                <p class="text-muted">Location: {{ assessment.image.location }}<br>This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'assessments:history' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
