{% extends 'base.html' %}
{% block title %}Login - DisasterAI{% endblock %}

{% block public_content %}
<div class="auth-wrapper">
    <div class="auth-card card">
        <div class="card-header">
            <div class="mb-2"><i class="bi bi-shield-exclamation text-primary" style="font-size:2.2rem;"></i></div>
            <h4 class="mb-0 text-primary fw-bold">DisasterAI</h4>
            <small class="text-muted">Damage Assessment System</small>
        </div>
        <div class="card-body">
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
            {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center mt-3 mb-0 small">
                Don't have an account? <a href="{% url 'accounts:register' %}">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
